<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quetschmünzen Sammlung</title>
  <style>
    :root {
      --copper:      #b5651d;
      --copper-dark: #8b4513;
      --copper-light:#d4845a;
      --gold:        #c9a84c;
      --gold-light:  #f0d080;
      --cream:       #fdf6ec;
      --warm-white:  #fffaf4;
      --text:        #3a2a1a;
      --text-light:  #7a5c3c;
      --border:      #e0c9a8;
      --shadow:      rgba(90, 50, 10, 0.12);
      --radius:      14px;
      --transition:  0.2s ease;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--cream);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: linear-gradient(135deg, var(--copper-dark) 0%, var(--copper) 60%, var(--gold) 100%);
      color: #fff;
      padding: 20px 24px 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.25);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo-icon {
      width: 44px;
      height: 44px;
      background: rgba(255,255,255,0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
    }
    header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.3px;
    }
    header p.subtitle {
      font-size: 0.8rem;
      opacity: 0.8;
      margin-top: 1px;
    }
    .btn-add-header {
      background: rgba(255,255,255,0.2);
      border: 2px solid rgba(255,255,255,0.5);
      color: #fff;
      padding: 9px 20px;
      border-radius: 50px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 7px;
      transition: background var(--transition), transform var(--transition);
      white-space: nowrap;
    }
    .btn-add-header:hover {
      background: rgba(255,255,255,0.33);
      transform: translateY(-1px);
    }

    /* ── Main ── */
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 28px 20px 60px;
    }

    /* ── Toolbar ── */
    .toolbar {
      display: flex;
      gap: 12px;
      margin-bottom: 28px;
      flex-wrap: wrap;
      align-items: center;
    }
    .search-wrap {
      position: relative;
      flex: 1;
      min-width: 200px;
    }
    .search-wrap svg {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-light);
      pointer-events: none;
    }
    .search-input {
      width: 100%;
      padding: 11px 14px 11px 40px;
      border: 2px solid var(--border);
      border-radius: 50px;
      font-size: 0.95rem;
      background: var(--warm-white);
      color: var(--text);
      transition: border-color var(--transition), box-shadow var(--transition);
      outline: none;
    }
    .search-input:focus {
      border-color: var(--copper);
      box-shadow: 0 0 0 3px rgba(181,101,29,0.15);
    }
    select.filter-select {
      padding: 11px 16px;
      border: 2px solid var(--border);
      border-radius: 50px;
      font-size: 0.9rem;
      background: var(--warm-white);
      color: var(--text);
      cursor: pointer;
      outline: none;
      transition: border-color var(--transition);
      min-width: 160px;
    }
    select.filter-select:focus { border-color: var(--copper); }

    .count-badge {
      color: var(--text-light);
      font-size: 0.88rem;
      white-space: nowrap;
      padding: 0 4px;
    }

    /* ── Empty state ── */
    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-light);
    }
    .empty-state .empty-icon { font-size: 4rem; margin-bottom: 16px; }
    .empty-state h2 { font-size: 1.3rem; margin-bottom: 8px; color: var(--text); }
    .empty-state p { font-size: 0.95rem; margin-bottom: 24px; }
    .btn-primary {
      background: linear-gradient(135deg, var(--copper), var(--copper-dark));
      color: #fff;
      border: none;
      padding: 12px 28px;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: transform var(--transition), box-shadow var(--transition);
      box-shadow: 0 4px 14px rgba(181,101,29,0.35);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(181,101,29,0.45);
    }

    /* ── Gallery Grid ── */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--warm-white);
      border-radius: var(--radius);
      box-shadow: 0 2px 10px var(--shadow);
      overflow: hidden;
      cursor: pointer;
      transition: transform var(--transition), box-shadow var(--transition);
      border: 1px solid var(--border);
      position: relative;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(90,50,10,0.18);
    }
    .card-img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      background: linear-gradient(135deg, #e8d5b7 0%, #d4b896 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.5rem;
      color: var(--copper-light);
    }
    .card-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .card-body {
      padding: 14px 16px 16px;
    }
    .card-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-meta {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .card-meta-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.82rem;
      color: var(--text-light);
    }
    .card-meta-item svg { flex-shrink: 0; }

    .card-actions {
      position: absolute;
      top: 8px;
      right: 8px;
      display: flex;
      gap: 5px;
      opacity: 0;
      transition: opacity var(--transition);
    }
    .card:hover .card-actions { opacity: 1; }
    .card-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform var(--transition);
      backdrop-filter: blur(4px);
    }
    .card-btn:hover { transform: scale(1.12); }
    .card-btn-edit {
      background: rgba(201,168,76,0.9);
      color: #fff;
    }
    .card-btn-delete {
      background: rgba(200,60,60,0.85);
      color: #fff;
    }

    /* ── Modals ── */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(30,15,5,0.55);
      backdrop-filter: blur(3px);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: fadeIn 0.18s ease;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .modal {
      background: var(--warm-white);
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 540px;
      max-height: 90vh;
      overflow-y: auto;
      animation: slideUp 0.22s ease;
    }
    @keyframes slideUp {
      from { transform: translateY(24px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }
    .modal-header {
      padding: 22px 24px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      background: var(--warm-white);
      border-radius: 20px 20px 0 0;
      z-index: 1;
    }
    .modal-header h2 { font-size: 1.2rem; color: var(--text); }
    .btn-close {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      background: var(--border);
      color: var(--text);
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background var(--transition);
      flex-shrink: 0;
    }
    .btn-close:hover { background: #cdb898; }
    .modal-body { padding: 22px 24px; }
    .modal-footer {
      padding: 16px 24px 22px;
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      border-top: 1px solid var(--border);
    }

    /* ── Form ── */
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-light);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input[type="text"],
    input[type="date"],
    textarea {
      width: 100%;
      padding: 11px 14px;
      border: 2px solid var(--border);
      border-radius: 10px;
      font-size: 0.95rem;
      background: var(--cream);
      color: var(--text);
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition);
      font-family: inherit;
    }
    input[type="text"]:focus,
    input[type="date"]:focus,
    textarea:focus {
      border-color: var(--copper);
      box-shadow: 0 0 0 3px rgba(181,101,29,0.15);
    }
    textarea { resize: vertical; min-height: 90px; }

    /* Photo upload */
    .photo-upload-area {
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color var(--transition), background var(--transition);
      background: var(--cream);
      position: relative;
    }
    .photo-upload-area:hover, .photo-upload-area.drag-over {
      border-color: var(--copper);
      background: rgba(181,101,29,0.05);
    }
    .photo-upload-area input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }
    .upload-icon { font-size: 2.2rem; margin-bottom: 8px; }
    .upload-text { font-size: 0.9rem; color: var(--text-light); }
    .upload-text strong { color: var(--copper); }
    .photo-preview {
      width: 100%;
      max-height: 220px;
      object-fit: contain;
      border-radius: 8px;
      margin-top: 12px;
      display: none;
    }
    .photo-preview.visible { display: block; }
    .photo-remove-btn {
      display: none;
      margin-top: 8px;
      background: none;
      border: 1px solid #d9534f;
      color: #d9534f;
      border-radius: 6px;
      padding: 4px 12px;
      font-size: 0.82rem;
      cursor: pointer;
      transition: background var(--transition), color var(--transition);
    }
    .photo-remove-btn.visible { display: inline-block; }
    .photo-remove-btn:hover { background: #d9534f; color: #fff; }

    /* Buttons */
    .btn-secondary {
      background: var(--cream);
      color: var(--text-light);
      border: 2px solid var(--border);
      padding: 10px 22px;
      border-radius: 50px;
      font-size: 0.95rem;
      cursor: pointer;
      font-weight: 600;
      transition: background var(--transition), border-color var(--transition);
    }
    .btn-secondary:hover { background: var(--border); border-color: #cdb898; }
    .btn-danger {
      background: #d9534f;
      color: #fff;
      border: none;
      padding: 10px 22px;
      border-radius: 50px;
      font-size: 0.95rem;
      cursor: pointer;
      font-weight: 600;
      transition: background var(--transition), transform var(--transition);
    }
    .btn-danger:hover { background: #c0392b; transform: translateY(-1px); }

    /* ── Detail Modal ── */
    .detail-modal { max-width: 600px; }
    .detail-img-wrap {
      width: 100%;
      aspect-ratio: 16/10;
      background: linear-gradient(135deg, #e8d5b7 0%, #d4b896 100%);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 5rem;
      color: var(--copper-light);
      margin-bottom: 20px;
    }
    .detail-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #f5ead8;
    }
    .detail-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 14px;
    }
    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }
    .detail-field {
      background: var(--cream);
      border-radius: 10px;
      padding: 12px 14px;
    }
    .detail-field-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--copper);
      margin-bottom: 4px;
    }
    .detail-field-value {
      font-size: 0.95rem;
      color: var(--text);
    }
    .detail-notes {
      grid-column: 1 / -1;
    }
    .detail-notes .detail-field-value {
      white-space: pre-wrap;
      line-height: 1.6;
    }

    /* ── Confirm dialog ── */
    .confirm-modal { max-width: 380px; }
    .confirm-modal .modal-body {
      text-align: center;
      padding: 28px 24px 20px;
    }
    .confirm-icon { font-size: 2.8rem; margin-bottom: 12px; }
    .confirm-modal h3 { font-size: 1.15rem; margin-bottom: 8px; }
    .confirm-modal p { font-size: 0.9rem; color: var(--text-light); }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--cream); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--copper-light); }

    /* ── Responsive ── */
    @media (max-width: 540px) {
      header h1 { font-size: 1.2rem; }
      .gallery { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
      .detail-grid { grid-template-columns: 1fr; }
      .modal-body, .modal-footer { padding-left: 16px; padding-right: 16px; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">
      <div class="logo-icon">🪙</div>
      <div>
        <h1>Quetschmünzen</h1>
        <p class="subtitle">Meine Pressed-Penny Sammlung</p>
      </div>
    </div>
    <button class="btn-add-header" onclick="openAddModal()">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Münze hinzufügen
    </button>
  </div>
</header>

<main>
  <div class="toolbar">
    <div class="search-wrap">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input class="search-input" type="text" id="searchInput" placeholder="Nach Motiv oder Ort suchen…" oninput="renderGallery()">
    </div>
    <select class="filter-select" id="filterLocation" onchange="renderGallery()">
      <option value="">Alle Orte</option>
    </select>
    <span class="count-badge" id="countBadge"></span>
  </div>

  <div id="gallery" class="gallery"></div>
  <div id="emptyState" class="empty-state" style="display:none">
    <div class="empty-icon">🪙</div>
    <h2>Noch keine Münzen</h2>
    <p>Füge deine erste Quetschmünze hinzu und starte deine Sammlung!</p>
    <button class="btn-primary" onclick="openAddModal()">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Erste Münze hinzufügen
    </button>
  </div>
</main>

<!-- ── Add/Edit Modal ── -->
<div id="formOverlay" class="overlay" style="display:none" onclick="handleOverlayClick(event,'formOverlay')">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h2 id="formModalTitle">Münze hinzufügen</h2>
      <button class="btn-close" onclick="closeModal('formOverlay')" title="Schließen">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Foto</label>
        <div class="photo-upload-area" id="uploadArea">
          <input type="file" id="photoInput" accept="image/*" onchange="handlePhotoSelect(event)">
          <div class="upload-icon">📷</div>
          <div class="upload-text"><strong>Klicken</strong> oder Bild hierher ziehen</div>
        </div>
        <img id="photoPreview" class="photo-preview" alt="Vorschau">
        <button class="photo-remove-btn" id="photoRemoveBtn" onclick="removePhoto()">Foto entfernen</button>
      </div>
      <div class="form-group">
        <label for="inputName">Motiv *</label>
        <input type="text" id="inputName" placeholder="z.B. Schloss Neuschwanstein" required>
      </div>
      <div class="form-group">
        <label for="inputLocation">Ort *</label>
        <input type="text" id="inputLocation" placeholder="z.B. Schwangau, Bayern" required>
      </div>
      <div class="form-group">
        <label for="inputDate">Datum</label>
        <input type="date" id="inputDate">
      </div>
      <div class="form-group">
        <label for="inputNotes">Notizen</label>
        <textarea id="inputNotes" placeholder="Besondere Erinnerungen, Automat-Nummer, Preis…"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeModal('formOverlay')">Abbrechen</button>
      <button class="btn-primary" onclick="saveCoin()">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
        <span id="formSubmitLabel">Hinzufügen</span>
      </button>
    </div>
  </div>
</div>

<!-- ── Detail Modal ── -->
<div id="detailOverlay" class="overlay" style="display:none" onclick="handleOverlayClick(event,'detailOverlay')">
  <div class="modal detail-modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h2>Details</h2>
      <button class="btn-close" onclick="closeModal('detailOverlay')" title="Schließen">✕</button>
    </div>
    <div class="modal-body" id="detailBody"></div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeModal('detailOverlay')">Schließen</button>
      <button class="btn-secondary" id="detailEditBtn" onclick="editFromDetail()">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="margin-right:5px"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        Bearbeiten
      </button>
      <button class="btn-danger" id="detailDeleteBtn" onclick="deleteFromDetail()">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="margin-right:5px"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
        Löschen
      </button>
    </div>
  </div>
</div>

<!-- ── Confirm Delete Modal ── -->
<div id="confirmOverlay" class="overlay" style="display:none" onclick="handleOverlayClick(event,'confirmOverlay')">
  <div class="modal confirm-modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h2>Münze löschen</h2>
      <button class="btn-close" onclick="closeModal('confirmOverlay')" title="Schließen">✕</button>
    </div>
    <div class="modal-body">
      <div class="confirm-icon">🗑️</div>
      <h3>Wirklich löschen?</h3>
      <p id="confirmText">Diese Münze wird unwiderruflich gelöscht.</p>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeModal('confirmOverlay')">Abbrechen</button>
      <button class="btn-danger" onclick="confirmDelete()">Ja, löschen</button>
    </div>
  </div>
</div>

<script>
  // ── Storage ──────────────────────────────────────────────
  const STORE_KEY = 'quetschmuenzen_v1';

  function loadCoins() {
    try { return JSON.parse(localStorage.getItem(STORE_KEY)) || []; }
    catch { return []; }
  }
  function saveCoins(coins) {
    localStorage.setItem(STORE_KEY, JSON.stringify(coins));
  }

  // ── State ────────────────────────────────────────────────
  let coins = loadCoins();
  let editingId = null;
  let pendingDeleteId = null;
  let currentDetailId = null;
  let currentPhotoData = null;

  // ── Utils ────────────────────────────────────────────────
  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }
  function formatDate(iso) {
    if (!iso) return '–';
    const [y, m, d] = iso.split('-');
    return `${d}.${m}.${y}`;
  }
  function escHtml(s) {
    return String(s ?? '')
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Gallery ──────────────────────────────────────────────
  function getFilteredCoins() {
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    const loc = document.getElementById('filterLocation').value;
    return coins.filter(c => {
      const matchSearch = !q ||
        c.name.toLowerCase().includes(q) ||
        c.location.toLowerCase().includes(q);
      const matchLoc = !loc || c.location === loc;
      return matchSearch && matchLoc;
    });
  }

  function renderGallery() {
    const filtered = getFilteredCoins();
    const gallery = document.getElementById('gallery');
    const empty   = document.getElementById('emptyState');
    const badge   = document.getElementById('countBadge');

    if (coins.length === 0) {
      gallery.innerHTML = '';
      gallery.style.display = 'none';
      empty.style.display = 'block';
      badge.textContent = '';
      return;
    }

    gallery.style.display = 'grid';
    empty.style.display = 'none';
    badge.textContent = filtered.length === coins.length
      ? `${coins.length} Münze${coins.length !== 1 ? 'n' : ''}`
      : `${filtered.length} von ${coins.length} Münze${coins.length !== 1 ? 'n' : ''}`;

    if (filtered.length === 0) {
      gallery.innerHTML = `
        <div style="grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--text-light)">
          <div style="font-size:2.5rem;margin-bottom:12px">🔍</div>
          <p style="font-size:1rem">Keine Münzen gefunden. Andere Suchbegriffe versuchen?</p>
        </div>`;
      return;
    }

    gallery.innerHTML = filtered.map(coin => `
      <div class="card" onclick="openDetail('${coin.id}')">
        <div class="card-img">
          ${coin.photo
            ? `<img src="${coin.photo}" alt="${escHtml(coin.name)}" loading="lazy">`
            : '🪙'}
        </div>
        <div class="card-actions">
          <button class="card-btn card-btn-edit" title="Bearbeiten"
            onclick="event.stopPropagation();openEditModal('${coin.id}')">
            <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </button>
          <button class="card-btn card-btn-delete" title="Löschen"
            onclick="event.stopPropagation();askDelete('${coin.id}')">
            <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
          </button>
        </div>
        <div class="card-body">
          <div class="card-title">${escHtml(coin.name)}</div>
          <div class="card-meta">
            <div class="card-meta-item">
              <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
              ${escHtml(coin.location)}
            </div>
            ${coin.date ? `
            <div class="card-meta-item">
              <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
              ${formatDate(coin.date)}
            </div>` : ''}
          </div>
        </div>
      </div>
    `).join('');
  }

  function updateLocationFilter() {
    const sel = document.getElementById('filterLocation');
    const current = sel.value;
    const locations = [...new Set(coins.map(c => c.location).filter(Boolean))].sort();
    sel.innerHTML = '<option value="">Alle Orte</option>' +
      locations.map(l => `<option value="${escHtml(l)}" ${l === current ? 'selected' : ''}>${escHtml(l)}</option>`).join('');
  }

  // ── Photo handling ───────────────────────────────────────
  function handlePhotoSelect(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => setPhotoPreview(ev.target.result);
    reader.readAsDataURL(file);
  }

  function setPhotoPreview(dataUrl) {
    currentPhotoData = dataUrl;
    const preview = document.getElementById('photoPreview');
    preview.src = dataUrl;
    preview.classList.add('visible');
    document.getElementById('photoRemoveBtn').classList.add('visible');
    document.getElementById('uploadArea').style.paddingBottom = '0';
  }

  function removePhoto() {
    currentPhotoData = null;
    const preview = document.getElementById('photoPreview');
    preview.src = '';
    preview.classList.remove('visible');
    document.getElementById('photoRemoveBtn').classList.remove('visible');
    document.getElementById('photoInput').value = '';
    document.getElementById('uploadArea').style.paddingBottom = '';
  }

  // Drag & drop
  document.addEventListener('DOMContentLoaded', () => {
    const area = document.getElementById('uploadArea');
    area.addEventListener('dragover', e => { e.preventDefault(); area.classList.add('drag-over'); });
    area.addEventListener('dragleave', () => area.classList.remove('drag-over'));
    area.addEventListener('drop', e => {
      e.preventDefault();
      area.classList.remove('drag-over');
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith('image/')) {
        const reader = new FileReader();
        reader.onload = ev => setPhotoPreview(ev.target.result);
        reader.readAsDataURL(file);
      }
    });
    renderGallery();
    updateLocationFilter();
  });

  // ── Modals ───────────────────────────────────────────────
  function openModal(id)  {
    document.getElementById(id).style.display = 'flex';
    document.body.style.overflow = 'hidden';
  }
  function closeModal(id) {
    document.getElementById(id).style.display = 'none';
    document.body.style.overflow = '';
  }
  function handleOverlayClick(e, id) {
    if (e.target === document.getElementById(id)) closeModal(id);
  }

  function resetForm() {
    document.getElementById('inputName').value = '';
    document.getElementById('inputLocation').value = '';
    document.getElementById('inputDate').value = '';
    document.getElementById('inputNotes').value = '';
    removePhoto();
  }

  function openAddModal() {
    editingId = null;
    resetForm();
    document.getElementById('formModalTitle').textContent = 'Münze hinzufügen';
    document.getElementById('formSubmitLabel').textContent = 'Hinzufügen';
    document.getElementById('inputDate').value = new Date().toISOString().split('T')[0];
    openModal('formOverlay');
    setTimeout(() => document.getElementById('inputName').focus(), 100);
  }

  function openEditModal(id) {
    const coin = coins.find(c => c.id === id);
    if (!coin) return;
    editingId = id;
    document.getElementById('formModalTitle').textContent = 'Münze bearbeiten';
    document.getElementById('formSubmitLabel').textContent = 'Speichern';
    document.getElementById('inputName').value = coin.name;
    document.getElementById('inputLocation').value = coin.location;
    document.getElementById('inputDate').value = coin.date || '';
    document.getElementById('inputNotes').value = coin.notes || '';
    if (coin.photo) setPhotoPreview(coin.photo);
    else removePhoto();
    openModal('formOverlay');
  }

  // ── Save ─────────────────────────────────────────────────
  function saveCoin() {
    const name     = document.getElementById('inputName').value.trim();
    const location = document.getElementById('inputLocation').value.trim();
    const date     = document.getElementById('inputDate').value;
    const notes    = document.getElementById('inputNotes').value.trim();

    if (!name) { highlight('inputName'); return; }
    if (!location) { highlight('inputLocation'); return; }

    if (editingId) {
      const idx = coins.findIndex(c => c.id === editingId);
      if (idx !== -1) {
        coins[idx] = { ...coins[idx], name, location, date, notes, photo: currentPhotoData ?? coins[idx].photo };
      }
    } else {
      coins.unshift({ id: uid(), name, location, date, notes, photo: currentPhotoData || null, createdAt: Date.now() });
    }

    saveCoins(coins);
    updateLocationFilter();
    renderGallery();
    closeModal('formOverlay');
  }

  function highlight(id) {
    const el = document.getElementById(id);
    el.style.borderColor = '#d9534f';
    el.focus();
    setTimeout(() => el.style.borderColor = '', 1500);
  }

  // ── Detail ───────────────────────────────────────────────
  function openDetail(id) {
    const coin = coins.find(c => c.id === id);
    if (!coin) return;
    currentDetailId = id;

    const body = document.getElementById('detailBody');
    body.innerHTML = `
      <div class="detail-img-wrap">
        ${coin.photo ? `<img src="${coin.photo}" alt="${escHtml(coin.name)}">` : '🪙'}
      </div>
      <div class="detail-title">${escHtml(coin.name)}</div>
      <div class="detail-grid">
        <div class="detail-field">
          <div class="detail-field-label">Ort</div>
          <div class="detail-field-value">${escHtml(coin.location)}</div>
        </div>
        <div class="detail-field">
          <div class="detail-field-label">Datum</div>
          <div class="detail-field-value">${formatDate(coin.date)}</div>
        </div>
        ${coin.notes ? `
        <div class="detail-field detail-notes">
          <div class="detail-field-label">Notizen</div>
          <div class="detail-field-value">${escHtml(coin.notes)}</div>
        </div>` : ''}
      </div>
    `;

    openModal('detailOverlay');
  }

  function editFromDetail() {
    closeModal('detailOverlay');
    openEditModal(currentDetailId);
  }

  function deleteFromDetail() {
    closeModal('detailOverlay');
    askDelete(currentDetailId);
  }

  // ── Delete ───────────────────────────────────────────────
  function askDelete(id) {
    const coin = coins.find(c => c.id === id);
    if (!coin) return;
    pendingDeleteId = id;
    document.getElementById('confirmText').textContent =
      `"${coin.name}" wird unwiderruflich gelöscht.`;
    openModal('confirmOverlay');
  }

  function confirmDelete() {
    if (!pendingDeleteId) return;
    coins = coins.filter(c => c.id !== pendingDeleteId);
    pendingDeleteId = null;
    saveCoins(coins);
    updateLocationFilter();
    renderGallery();
    closeModal('confirmOverlay');
  }

  // ── Keyboard ─────────────────────────────────────────────
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      ['confirmOverlay','detailOverlay','formOverlay'].forEach(id => {
        if (document.getElementById(id).style.display !== 'none') closeModal(id);
      });
    }
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      if (document.getElementById('formOverlay').style.display !== 'none') saveCoin();
    }
  });
</script>
</body>
</html>
