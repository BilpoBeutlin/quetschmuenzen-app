<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="115" fill="#fdf6ec"/>
  <!-- Outer coin ring -->
  <circle cx="256" cy="256" r="210" fill="url(#goldRing)" stroke="#c9a84c" stroke-width="6"/>
  <!-- Inner coin face -->
  <circle cx="256" cy="256" r="180" fill="url(#copperFace)"/>
  <!-- Coin edge grooves -->
  <circle cx="256" cy="256" r="196" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="4" stroke-dasharray="8 6"/>
  <!-- Press marks / relief lines -->
  <ellipse cx="256" cy="220" rx="70" ry="55" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="5"/>
  <!-- Stylized coin symbol -->
  <text x="256" y="290" text-anchor="middle" font-family="Georgia,serif" font-size="120" font-weight="bold"
        fill="rgba(255,255,255,0.9)" letter-spacing="-4">€</text>
  <!-- Arrow overlay (pressed penny flattening) -->
  <path d="M190 310 Q256 360 322 310" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="6" stroke-linecap="round"/>
  <defs>
    <radialGradient id="goldRing" cx="38%" cy="35%">
      <stop offset="0%"   stop-color="#f0d080"/>
      <stop offset="60%"  stop-color="#c9a84c"/>
      <stop offset="100%" stop-color="#8b6914"/>
    </radialGradient>
    <radialGradient id="copperFace" cx="38%" cy="35%">
      <stop offset="0%"   stop-color="#d4845a"/>
      <stop offset="55%"  stop-color="#b5651d"/>
      <stop offset="100%" stop-color="#6b3410"/>
    </radialGradient>
  </defs>
</svg>
